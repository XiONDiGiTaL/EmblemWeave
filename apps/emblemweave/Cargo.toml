[package]
name = "emblemweave"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EmblemWeave: native PC recompilation launcher, by XiØN"
build = "build.rs"

[[bin]]
name = "EmblemWeave"
path = "src/main.rs"

[[bin]]
name = "ew-storage"
path = "src/bin/ew_storage.rs"
# The storage modules carry unit tests in the launcher's test target; this
# console front end does not need a second test harness.
test = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ew-format.workspace = true
ew-lift.workspace = true
ew-runtime.workspace = true
ew-boot.workspace = true
eframe = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
ruzstd.workspace = true
tar = "0.4"
zstd = "0.13"
sha2.workspace = true
roxmltree = "0.20"
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
uuid = { version = "1.8", features = ["serde", "v4"] }
clap = { version = "4.5", features = ["derive", "env"] }
walkdir = "2.5"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_Console"] }
