Brightness of the 3D scene before the tone map, in stops. 0 = the game's.	色调映射之前 3D 场景的亮度，单位为档。0 = 游戏原值。
Scene contrast around mid grey, before the tone map. 1 = the game's.	色调映射之前以中间灰为基准的场景对比度。1 = 游戏原值。
Shadows = 阴影
Above 1 lifts the scene below mid grey, below 1 deepens it. 1 = the game's.	大于 1 提亮中间灰以下的部分，小于 1 则压暗。1 = 游戏原值。
Highlights = 高光
Above 1 brightens the scene above mid grey, below 1 tames it. 1 = the game's.	大于 1 提亮中间灰以上的部分，小于 1 则压低。1 = 游戏原值。
Scene colour intensity before the tone map (the UI is not touched). 1 = the game's.	色调映射之前的场景色彩浓淡（不影响界面）。1 = 游戏原值。
Post effects = 后期特效
Bloom = 泛光
Strength of the game's glow around bright lights. 1 = the game's, 0 = none. SDR and HDR.	游戏中强光周围光晕的强度。1 = 游戏原值，0 = 无。适用于 SDR 和 HDR。
Sharpening = 锐化强度
Strength of the game's own sharpening of the finished picture. 1 = the game's, 0 = none. SDR and HDR.	游戏自身对最终画面锐化的强度。1 = 游戏原值，0 = 无。适用于 SDR 和 HDR。
Motion blur = 动态模糊
Strength of the game's camera motion blur. 1 = the game's, 0 = none, 2 = twice the blur length. SDR and HDR.	游戏镜头动态模糊的强度。1 = 游戏原值，0 = 无，2 = 模糊长度加倍。适用于 SDR 和 HDR。
Depth of field = 景深
Strength of the game's out-of-focus blur. 1 = the game's, 0 = everything sharp, 2 = a wider aperture: more blur, starting closer to the focus. SDR and HDR.	游戏失焦模糊的强度。1 = 游戏原值，0 = 全部清晰，2 = 更大光圈：模糊更强，且从更靠近焦点处开始。适用于 SDR 和 HDR。
Vignette = 暗角
Strength of the darkened screen edges in the scenes that have one (the world map, some story scenes). 1 = the game's, 0 = none. SDR and HDR.	在带暗角的场景（世界地图、部分剧情场景）中屏幕边缘压暗的强度。1 = 游戏原值，0 = 无。适用于 SDR 和 HDR。
Compare with the game = 与原版对比
Testing aid: the left half of the screen as the game draws it, the right half with your scene grading, highlight saturation and sharpening (HDR needed for grading and highlight saturation). = 测试辅助：屏幕左半部分为游戏原本画面，右半部分应用你的场景调色、高光饱和度与锐化强度（调色和高光饱和度需要 HDR）。
30 is the game's own. 60 runs gameplay at 60 at the right speed. 120 needs a frame limit of 120 or more and a fast PC. Frame-rate fixes below keep frame-counted effects at their 30 fps speed. = 30 是游戏原本的帧率。60 以正确的速度跑 60 帧游玩。120 需要帧数上限不低于 120 且电脑够快。下方的「帧率修正」让按帧计数的效果保持 30 帧时的速度。
Frame-rate fixes = 帧率修正
At 60 and 120 fps: physics, capes and hair, cutscene shakes, map markers, menu animations and dialogue typing that count frames move at their 30 fps speed. [fefw] frame_fixes_skip in the ini turns single groups off. = 60 和 120 帧时：按帧计数的物理、披风与头发、过场镜头晃动、地图标记、菜单动画和对话打字按 30 帧时的速度运行。ini 中的 [fefw] frame_fixes_skip 可单独关闭某一组。
Speakers = 扬声器
Stereo, or 5.1 surround (front left and right, centre, LFE, rear left and right). Windows downmixes 5.1 on a stereo device, so pick 5.1 only for a 5.1 or 7.1 output. [audio] channels in fefw.ini or NXRT_AUDIO_CHANNELS wins over this. = 立体声，或 5.1 环绕声（左前、右前、中置、低音、左后、右后）。在立体声设备上 Windows 会把 5.1 混缩，因此只有 5.1 或 7.1 输出时才选 5.1。fefw.ini 中的 [audio] channels 或 NXRT_AUDIO_CHANNELS 优先级更高。
Stereo = 立体声
5.1 surround = 5.1 环绕声
