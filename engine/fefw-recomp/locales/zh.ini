Highlight saturation = 高光饱和度
0 = the game's highlights, which turn white as they brighten; higher keeps the scene's own colour in bright highlights (fire, magic, sunsets). Below paper white nothing changes.	0 = 游戏原本的高光，越亮越趋于白色；数值越高，明亮高光（火焰、魔法、日落）越能保留场景本身的颜色。纸白以下没有任何变化。
Hue preservation = 色相保持
0 = the game's tone curve, which shifts strong colours as they brighten (orange toward yellow, deep blue toward cyan). Higher keeps the scene's own hues through the whole range. HDR.	0 = 游戏原本的色调曲线，鲜明的颜色变亮时会偏色（橙色偏黄，深蓝偏青）。数值越高，整个亮度范围内越能保持场景本身的色相。用于 HDR。
Wide colour = 广色域
HDR enhancement: keeps the colours the game itself renders beyond the standard range (it lights the scene in BT.2020), which SDR has to clip. Everything inside the standard range stays as in SDR. Off = SDR colours exactly.	HDR 增强：保留游戏本身渲染出的超出标准范围的颜色（场景光照在 BT.2020 中计算），这些颜色在 SDR 中只能被裁掉。标准范围内的颜色与 SDR 完全一致。关闭 = 与 SDR 颜色完全相同。
Dither output = 输出抖动
Adds very fine noise before the picture goes to the display, hiding faint steps in smooth dark gradients (night skies, fades). = 在画面送到显示器之前加入极细的噪点，掩盖平滑暗部渐变（夜空、淡入淡出）中的轻微色阶。
Colour expansion = 色彩扩展
0 keeps the game's SDR colours exactly; higher pushes strongly saturated colours into the wider HDR range. Taste, not accuracy. = 0 完全保持游戏的 SDR 颜色；数值越高，高饱和颜色越向更广的 HDR 范围扩展。取决于个人喜好，并非为了准确。
