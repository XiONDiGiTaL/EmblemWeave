Sets Render scale, Shadow resolution, Quality and the four detail settings together. Low is for a slower GPU or a handheld PC; Medium is the console's picture (the defaults); High and Ultra render sharper. Output size and the upscaler are not changed; a fixed render size is cleared. = 同时设置渲染比例、阴影贴图尺寸、画质与四项细节设置。「低」适合较慢的显卡或掌机 PC；「中」为主机画面（默认值）；「高」与「极高」渲染更清晰。不会改动输出尺寸与超分方式；固定渲染尺寸会被清除。
