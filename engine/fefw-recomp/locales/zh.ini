The mouse works as the game's Joy-Con 2 mouse: move it and the game switches to its mouse controls (camera in bases and dungeons, map cursor in battle, selection in menus); press a key or use the controller and it switches back. The game's own speeds are the (Mouse) rows of its System > Settings; System > Mouse Controls lists every button. = 鼠标作为游戏的 Joy-Con 2 鼠标使用：移动鼠标，游戏就切换到鼠标操作（据点和迷宫中控制镜头，战斗中控制地图光标，菜单中进行选择）；按任意键或动手柄则切回。游戏自带的速度选项是其「系统 > 设置」中标有（鼠标）的项目；「系统 > 鼠标操作」列出了所有按键。
