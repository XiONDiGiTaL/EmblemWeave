NPC limit = NPC 上限
How many townspeople a town shows. The game keeps at most 70 different NPC models loaded, shows them within 80 m and under a draw budget; past those limits townspeople are hidden, even close by, and pop in as you walk. This multiplies all three. More memory and CPU work. Console = exactly the game's behaviour.	城镇中显示多少居民。游戏最多保留 70 种不同的 NPC 模型，只在 80 米内并在绘制预算之内显示它们；超出这些上限的居民会被隐藏（即使就在附近），走动时会突然出现。此项将三者同时放大。占用更多内存和 CPU。主机 = 与游戏原本行为完全一致。
