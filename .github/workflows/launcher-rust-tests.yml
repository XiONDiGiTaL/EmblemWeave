name: Launcher Rust tests

# The launcher crate is Windows-only (egui/windows-sys plus the winresource
# build script), so its test suite runs on windows-latest. The workspace
# crates it depends on are pure Rust and need no extra setup.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test -p emblemweave
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Two tests compare the embedded Trinity manifests with Trinity/shared.
      # Keep that checkout beside this repo and point TRINITY_ROOT at it; the
      # commit is the one the embedded copies were synced from.
      - uses: actions/checkout@v4
        with:
          repository: XiONDiGiTaL/Trinity
          ref: aa1f627104e7dd0cc317d31154b3e407006ec40c
          path: Trinity
      - uses: dtolnay/rust-toolchain@stable

      - name: Run the launcher test suite
        env:
          RUST_BACKTRACE: 1
          TRINITY_ROOT: ${{ github.workspace }}/Trinity
        run: cargo test -p emblemweave --locked
