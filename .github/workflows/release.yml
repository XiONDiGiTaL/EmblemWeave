name: Release

# A tag is the release. The machine that packed 0.1.33 going offline cannot kill this run, and a manual
# `workflow_dispatch` with dry_run: true builds and verifies both archives without creating a tag or release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (for example 0.1.34)
        required: true
        default: 0.1.34
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            dry="$INPUT_DRY"
            if [ "$dry" != "true" ]; then
              echo "a manual run publishes only with a tag push; use dry_run: true to build and verify"
              exit 1
            fi
          else
            version="${REF_NAME#v}"
            dry=false
          fi
          test -f "docs/changelog/$version.md" || { echo "docs/changelog/$version.md is missing"; exit 1; }
          cargo_version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          test "$cargo_version" = "$version" || { echo "Cargo.toml says $cargo_version, the run says $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "preparing $version (dry run: $dry)"

      - name: Check every release pointer names this version
        run: python tools/check_release.py

      - name: Release validation tests
        run: python3 -m unittest discover -s tools/tests -v

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage the pinned shader-translator sources
        env:
          RYUBING_REV: a82350bb774f70fcbd41c9987bf67a3775409963
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://git.ryujinx.app/ryubing/ryujinx.git "$RUNNER_TEMP/ryubing"
          git -C "$RUNNER_TEMP/ryubing" checkout --quiet "$RYUBING_REV"
          dst=engine/fefw-recomp/tools/shaders/third_party/ryubing
          mkdir -p "$dst/src"
          for p in Ryujinx.Common Spv.Generator Ryujinx.Graphics.Shader; do
            cp -a "$RUNNER_TEMP/ryubing/src/$p" "$dst/src/"
            rm -rf "$dst/src/$p/obj" "$dst/src/$p/bin"
          done
          for f in Directory.Build.props Directory.Packages.props global.json nuget.config LICENSE.txt; do
            cp "$RUNNER_TEMP/ryubing/$f" "$dst/$f"
          done
      - name: Build and verify the Windows zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File tools/package_release.ps1 -Version '${{ needs.prepare.outputs.version }}' -RequireConfigureCheck
          if ($LASTEXITCODE -ne 0) { throw "package_release.ps1 failed ($LASTEXITCODE)" }
          Get-Content target/pkg/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          if-no-files-found: error
          path: |
            target/pkg/*.zip
            target/pkg/manifest.json
            target/pkg/release-manifest.json

  runtime-gate:
    needs: prepare
    uses: ./.github/workflows/launcher-tests.yml

  linux-translator:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage the pinned shader-translator sources
        env:
          RYUBING_REV: a82350bb774f70fcbd41c9987bf67a3775409963
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://git.ryujinx.app/ryubing/ryujinx.git "$RUNNER_TEMP/ryubing"
          git -C "$RUNNER_TEMP/ryubing" checkout --quiet "$RYUBING_REV"
          dst=engine/fefw-recomp/tools/shaders/third_party/ryubing
          mkdir -p "$dst/src"
          for p in Ryujinx.Common Spv.Generator Ryujinx.Graphics.Shader; do
            cp -a "$RUNNER_TEMP/ryubing/src/$p" "$dst/src/"
            rm -rf "$dst/src/$p/obj" "$dst/src/$p/bin"
          done
          for f in Directory.Build.props Directory.Packages.props global.json nuget.config LICENSE.txt; do
            cp "$RUNNER_TEMP/ryubing/$f" "$dst/$f"
          done
      - name: Publish the shader translator for Linux
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out="engine/fefw-recomp/tools/shaders/prebuilt/linux-x64"
          dotnet publish engine/fefw-recomp/tools/shaders/harness/SpirvHarness.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -o "$out"
          test -x "$out/spirv_harness"
          mkdir -p dist/translator/linux-x64
          cp "$out/spirv_harness" dist/translator/linux-x64/
          chmod 755 dist/translator/linux-x64/spirv_harness
          tar --mode='u+rwx,go+rx' -czf "dist/EmblemWeave-v${VERSION}-shader-translator-linux-x64.tar.gz" -C dist/translator linux-x64
          python tools/verify_archive.py "dist/EmblemWeave-v${VERSION}-shader-translator-linux-x64.tar.gz" --require linux-x64/spirv_harness
      - uses: actions/upload-artifact@v4
        with:
          name: linux-translator
          if-no-files-found: error
          path: dist/*.tar.gz

  publish:
    needs: [prepare, windows, linux-translator, runtime-gate]
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify both archives before upload
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh dist
          python tools/verify_archive.py "dist/EmblemWeave-v${VERSION}-windows-x64.zip" \
            --require "EmblemWeave-v${VERSION}/EmblemWeave.exe" \
            --require "EmblemWeave-v${VERSION}/recomplauncher.json" \
            --require "EmblemWeave-v${VERSION}/engine/fefw-recomp/runtime/third_party/dav1d/CMakeLists.txt" \
            --require "EmblemWeave-v${VERSION}/engine/fefw-recomp/runtime/third_party/ffmpeg/include/libavcodec/avcodec.h" \
            --require "EmblemWeave-v${VERSION}/engine/fefw-recomp/runtime/third_party/ffmpeg/COPYING.LGPLv2.1" \
            --require "EmblemWeave-v${VERSION}/upscalers/ffmpeg/avcodec-62.dll" \
            --require "EmblemWeave-v${VERSION}/upscalers/ffmpeg/avutil-60.dll" \
            --require "EmblemWeave-v${VERSION}/upscalers/ffmpeg/swresample-6.dll" \
            --require "EmblemWeave-v${VERSION}/upscalers/ffmpeg/LICENSE.txt" \
            --require "EmblemWeave-v${VERSION}/upscalers/ffmpeg/SHA256SUMS" \
            --require "EmblemWeave-v${VERSION}/upscalers/ffmpeg/README.md" \
            --require "EmblemWeave-v${VERSION}/tools/verify_install.py" \
            --require "EmblemWeave-v${VERSION}/engine/fefw-recomp/tools/shaders/prebuilt/win-x64/LICENSE.Ryujinx.MIT.txt" \
            --require "EmblemWeave-v${VERSION}/engine/fefw-recomp/tools/shaders/prebuilt/win-x64/DOTNET-LICENSE.txt" \
            --require "EmblemWeave-v${VERSION}/engine/fefw-recomp/tools/shaders/prebuilt/win-x64/DOTNET-THIRD-PARTY-NOTICES.txt"
          python tools/release_manifest.py verify \
            --archive "dist/EmblemWeave-v${VERSION}-windows-x64.zip" \
            --manifest dist/release-manifest.json
          python tools/verify_archive.py "dist/EmblemWeave-v${VERSION}-shader-translator-linux-x64.tar.gz" --require linux-x64/spirv_harness
          (cd dist && python ../tools/release_sums.py finalize \
            --sums SHA256SUMS \
            --artifact "EmblemWeave-v${VERSION}-windows-x64.zip" \
            --artifact "EmblemWeave-v${VERSION}-shader-translator-linux-x64.tar.gz" \
            --artifact release-manifest.json)
          cat dist/SHA256SUMS
      - name: Write the notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python tools/release_notes.py \
            --version "$VERSION" \
            --changelog "docs/changelog/$VERSION.md" \
            --zip "dist/EmblemWeave-v${VERSION}-windows-x64.zip" \
            --tar "dist/EmblemWeave-v${VERSION}-shader-translator-linux-x64.tar.gz" \
            --out "dist/release-notes-$VERSION.md"
      - name: Publish the release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$REPO" --title "EmblemWeave $VERSION" --notes-file "dist/release-notes-$VERSION.md"
            gh release upload "$tag" --repo "$REPO" --clobber dist/*.zip dist/*.tar.gz dist/release-manifest.json dist/SHA256SUMS
          else
            gh release create "$tag" --repo "$REPO" --verify-tag \
              --title "EmblemWeave $VERSION" --notes-file "dist/release-notes-$VERSION.md" \
              dist/*.zip dist/*.tar.gz dist/release-manifest.json dist/SHA256SUMS
          fi
          gh release view "$tag" --repo "$REPO" --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, draft: .isDraft, pre: .isPrerelease, assets: [.assets[] | {name, digest}]}'
      - name: Dry run summary
        if: needs.prepare.outputs.dry_run == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Dry run for v${VERSION}: both archives built and verified; no tag, release, badge or site file was changed."
          cat "dist/release-notes-${VERSION}.md"

  site:
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp the site fallback and release.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python tools/stamp_site.py --version "$VERSION" --tag "v${VERSION}" \
            --download "https://github.com/${REPO}/releases/download/v${VERSION}/EmblemWeave-v${VERSION}-windows-x64.zip"
          git config user.name 'EmblemWeave release'
          git config user.email 'releases@users.noreply.github.com'
          git add docs/index.html docs/release.json
          if ! git diff --cached --quiet; then
            git commit -m "Site: release v${VERSION}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Post-deploy smoke check
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python tools/smoke_site.py --url "https://xiondigital.net/EmblemWeave/" \
            --expect-version "$VERSION" --retries 30 --delay 20
