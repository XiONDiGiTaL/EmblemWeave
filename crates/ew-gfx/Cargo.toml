[package]
name = "ew-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EmblemWeave host graphics: the Vulkan device behind the NVN layer"

[dependencies]
ash = { version = "0.38", features = ["loaded"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[[bin]]
name = "ew-present"
path = "src/bin/ew-present.rs"
