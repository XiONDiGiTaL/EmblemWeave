[workspace]
resolver = "2"
members = [
    "crates/ew-format",
    "crates/ew-lift",
    "crates/ew-runtime",
    "crates/ew-boot",
    "crates/ew-gfx",
    "apps/eblemweave",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
authors = ["XiØN"]
repository = "https://github.com/XiONDiGiTaL/EmblemWeave"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
ruzstd = "0.7"
sha2 = "0.10"
ew-format = { path = "crates/ew-format" }
ew-lift = { path = "crates/ew-lift" }
ew-runtime = { path = "crates/ew-runtime" }
ew-boot = { path = "crates/ew-boot" }
ew-gfx = { path = "crates/ew-gfx" }

[profile.release]
lto = "thin"
codegen-units = 1
